stages:
  - quality
  - mobile

api_tests:
  stage: quality
  image: node:22-bookworm-slim
  script:
    - cd api-tests
    - npm ci
    - npm run typecheck
    - npm test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - api-tests/reports/
    reports:
      junit: api-tests/reports/junit.xml

mobile_android:
  stage: mobile
  tags:
    - android-appium
  when: manual
  allow_failure: true
  script:
    - cd mobile-tests
    - npm ci
    - test -n "$(adb devices | grep -E '^[[:alnum:]_.:-]+[[:space:]]+device$')"
    - adb shell pm path com.wdiodemoapp | grep package
    - npx appium driver list --installed | grep uiautomator2
    - npx appium --log-level error > appium-server.log 2>&1 &
    - sleep 10
    - npm run test:android
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - mobile-tests/allure-results/
      - mobile-tests/artifacts/
      - mobile-tests/appium-server.log

mobile_ios:
  stage: mobile
  tags:
    - macos-ios-appium
  when: manual
  allow_failure: true
  script:
    - cd mobile-tests
    - npm ci
    - xcodebuild -version
    - test -n "$IOS_APP_PATH"
    - test -e "$IOS_APP_PATH"
    - npx appium driver list --installed | grep xcuitest
    - npx appium --log-level error > appium-server.log 2>&1 &
    - sleep 10
    - npm run test:ios
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - mobile-tests/allure-results/
      - mobile-tests/artifacts/
      - mobile-tests/appium-server.log
