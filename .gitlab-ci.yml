stages:
  - quality
  - mobile

api_tests:
  stage: quality
  image: node:22-bookworm-slim

  script:
    - cd api-tests
    - npm ci
    - npm run typecheck
    - npm test

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - api-tests/reports/
    reports:
      junit: api-tests/reports/junit.xml

mobile_android:
  stage: mobile

  # Exige runner com Android SDK, emulador e Appium configurados.
  tags:
    - android-appium

  when: manual
  allow_failure: true

  script:
    - cd mobile-tests
    - npm ci
    - adb devices
    - adb shell pm path com.wdiodemoapp
    - npx appium driver list --installed
    - npx appium --log-level error > appium-server.log 2>&1 &
    - sleep 10
    - npm run test:android

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - mobile-tests/allure-results/
      - mobile-tests/artifacts/
      - mobile-tests/appium-server.log
